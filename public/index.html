<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>谁是瞎掰王</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 登录/注册页 -->
    <div id="page-auth" class="page active">
      <div class="auth-container">
        <h1 class="game-title">🎭 谁是瞎掰王</h1>
        <p class="subtitle">多人派对猜词游戏</p>
        <div class="tab-bar">
          <button class="tab-btn active" data-tab="login">登录</button>
          <button class="tab-btn" data-tab="register">注册</button>
        </div>
        <div id="form-login" class="auth-form">
          <input type="text" id="login-account" placeholder="输入账号" maxlength="20">
          <button class="btn-primary" id="btn-login">登 录</button>
        </div>
        <div id="form-register" class="auth-form hidden">
          <input type="text" id="reg-account" placeholder="账号（字母/数字）" maxlength="20">
          <input type="text" id="reg-nickname" placeholder="昵称" maxlength="12">
          <button class="btn-primary" id="btn-register">注 册</button>
        </div>
        <p id="auth-msg" class="msg"></p>
      </div>
    </div>

    <!-- 大厅页 -->
    <div id="page-lobby" class="page">
      <div class="lobby-header">
        <h2>🏠 公共大厅</h2>
        <div class="user-menu-wrapper">
          <span id="lobby-user" class="user-badge"></span>
          <div id="user-dropdown" class="user-dropdown hidden">
            <div class="dropdown-info">
              <div class="dropdown-nickname" id="dropdown-nickname"></div>
              <div class="dropdown-account" id="dropdown-account"></div>
              <div class="dropdown-status">🟢 在线</div>
            </div>
            <button class="btn-logout" id="btn-logout">退出登录</button>
          </div>
        </div>
      </div>
      <button class="btn-primary btn-create" id="btn-show-create">+ 创建房间</button>
      <div id="create-room-form" class="hidden card">
        <input type="text" id="room-name" placeholder="房间名称" maxlength="20">
        <label class="checkbox-label">
          <input type="checkbox" id="room-need-pwd"> 需要密码
        </label>
        <input type="password" id="room-pwd" placeholder="房间密码" class="hidden" maxlength="20">
        <div class="form-actions">
          <button class="btn-primary" id="btn-create-room">创建</button>
          <button class="btn-secondary" id="btn-cancel-create">取消</button>
        </div>
      </div>
      <div id="room-list" class="room-list">
        <p class="empty-hint">暂无房间，快来创建一个吧！</p>
      </div>
      <!-- 密码弹窗 -->
      <div id="pwd-modal" class="modal hidden">
        <div class="modal-content">
          <h3>输入房间密码</h3>
          <input type="password" id="join-pwd" placeholder="密码">
          <div class="form-actions">
            <button class="btn-primary" id="btn-join-confirm">加入</button>
            <button class="btn-secondary" id="btn-join-cancel">取消</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 房间页 -->
    <div id="page-room" class="page">
      <div class="room-header">
        <button class="btn-back" id="btn-leave-room">← 离开</button>
        <h2 id="room-title">房间</h2>
        <button class="btn-icon" id="btn-scoreboard">🏆</button>
      </div>
      <div id="player-list" class="player-list"></div>
      <div id="room-controls" class="room-controls"></div>
      <div id="game-area" class="game-area"></div>
      <div id="announcements" class="announcements"></div>
      <!-- 积分排名弹窗 -->
      <div id="score-modal" class="modal hidden">
        <div class="modal-content">
          <h3>🏆 积分排名</h3>
          <div id="score-list"></div>
          <button class="btn-secondary" id="btn-close-score">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
